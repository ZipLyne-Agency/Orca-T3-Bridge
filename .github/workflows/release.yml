name: Release Mac app
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: swift test --package-path macos --jobs 4
      - name: Assemble before signing credentials are available
        env:
          BRIDGE_OUTPUT: ${{ runner.temp }}/bridge-release
        run: |
          bash scripts/build-macos.sh
          npm pack --pack-destination "$BRIDGE_OUTPUT"
      - name: Sign, notarize, and publish
        run: python3 scripts/ci-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BRIDGE_SIGNING_IDENTITY: 'Developer ID Application: ZipLyne LLC (DHGG5BA7J7)'
          BRIDGE_TEAM_ID: DHGG5BA7J7
          BRIDGE_OUTPUT: ${{ runner.temp }}/bridge-release
